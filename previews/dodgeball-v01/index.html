<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c6cdc1" />
    <title>热血躲避 · 3D 构图样张</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #c6cdc1; }
      body { display: grid; place-items: center; }
      canvas { display: block; width: min(100vw, 177.777778vh); height: min(100vh, 56.25vw); outline: none; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="stage" tabindex="0" aria-label="躲避球静态构图：二号教学楼前，蓝队在两端投接，红队在中间躲避。L切换语言，Esc暂停显示，X查看无HUD场景。"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
