<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>校园里的小鸟 · 动态样张</title>
  <style>
    :root{color-scheme:light;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#353e37;background:#e9e8dd}
    *{box-sizing:border-box}body{margin:0}main{height:100dvh;min-height:540px;display:grid;grid-template-rows:auto 1fr auto;max-width:1600px;margin:auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 30px 16px;border-bottom:1px solid #525d4024}
    h1{margin:0;font-size:23px;font-weight:600;letter-spacing:.07em}p{margin:7px 0 0;font-size:12px;color:#667164;line-height:1.6}
    nav,.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:inherit;border:1px solid #73806b75;background:#efeee3;padding:9px 16px;border-radius:4px;cursor:pointer;min-height:42px}
    button[aria-pressed=true],button.primary{background:#52624e;color:#fffcec;border-color:#52624e}button:focus-visible,input:focus-visible{outline:2px solid #a85e3a;outline-offset:3px}
    #stage{position:relative;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
    #status{position:absolute;top:18px;left:30px;pointer-events:none;font-size:13px;letter-spacing:.1em;color:#57674e}
    #loading{position:absolute;inset:0;display:grid;place-content:center;background:#e9e8dd;font-size:14px}#loading[hidden]{display:none}
    footer{padding:14px 30px 20px;border-top:1px solid #525d4024;background:#e9e8dd}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:18px}.timeline{display:flex;align-items:center;gap:16px;margin-top:12px;font-size:12px;color:#667164}input{flex:1;min-width:0;accent-color:#52624e}
    .hint{display:flex;justify-content:space-between;gap:15px;font-size:11px;color:#737c6f;margin-top:8px}.hint span{line-height:1.6}
    @media(max-width:600px){header{padding:16px;gap:10px;align-items:flex-start}h1{font-size:18px}header p{max-width:190px;font-size:11px}nav{gap:5px}button{padding:8px 11px;font-size:12px}footer{padding:12px 16px}.controls{align-items:flex-start;gap:9px}.actions{gap:5px}#status{left:16px}.hint{font-size:10px}main{min-height:540px}}
  </style>
</head>
<body><main>
  <header><div><h1>校园里的小鸟</h1><p>简练的外形，自然的起落。<br>单只动作观察 · 与校园共用模型和动画</p></div><nav aria-label="选择鸟类"><button data-species="sparrow" aria-pressed="true">麻雀</button><button data-species="pigeon" aria-pressed="false">鸽子</button></nav></header>
  <section id="stage" aria-label="可拖动旋转的三维鸟类动态样张"><canvas></canvas><div id="status" aria-live="polite"></div><div id="loading">正在准备小鸟…</div></section>
  <footer><div class="controls"><div class="actions"><button id="pause" class="primary">暂停</button><button id="replay">重看起飞</button></div><div class="actions"><button data-view="detail" aria-pressed="true">动作观察</button><button data-view="walk" aria-pressed="false">漫游距离</button></div></div>
  <label class="timeline">动作进度<input id="timeline" type="range" min="0" max="1000" value="0" aria-label="动作进度"><span id="time">0.0 秒</span></label>
  <div class="hint"><span>拖动旋转 · 滚轮／双指缩放 · 空格暂停</span><span id="metrics"></span></div></footer>
</main><script type="module" src="./main.js"></script></body></html>
