<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <pattern id="oc-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e5e1d7" stroke-width="1"/></pattern>
    <marker id="oc-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#50524d"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#292a27}.title{font-size:30px;font-weight:650}.subtitle{font-size:15px;fill:#696b65}.label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}.wall{fill:#8f6d56;stroke:#5d4638;stroke-width:1}.room{fill:#eadb9a}.door{fill:#8b5a3c;stroke:#503321;stroke-width:3}.window{fill:#8fa4aa;stroke:#3f5960;stroke-width:3}.roofline{fill:none;stroke:#252622;stroke-width:2;stroke-dasharray:7 5}.dim{stroke:#50524d;stroke-width:1.5;marker-start:url(#oc-arrow);marker-end:url(#oc-arrow)}.ext{stroke:#898b85;stroke-width:1;stroke-dasharray:4 4}.confirmed{fill:#e7f0e8;stroke:#72957a;stroke-width:1.5}.working{fill:#f4eee0;stroke:#aa8754;stroke-width:1.5;stroke-dasharray:7 5}.north{stroke:#33342f;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect width="1500" height="1000" fill="#faf9f5"/>
  <rect x="45" y="110" width="1410" height="650" fill="url(#oc-grid)" opacity=".55"/>
  <text x="70" y="58" class="title">旧教室｜一层平面图 v0.1</text>
  <text x="70" y="87" class="subtitle">两间不可进入的旧教室｜正面朝南｜工作外包尺寸约26 × 7.5 m（C级占位值）</text>

  <!-- Direction -->
  <g transform="translate(1330 145)"><path d="M0 70V0M0 0L-10 18M0 0L10 18" class="north"/><text x="0" y="-10" text-anchor="middle" class="label">北</text><text x="0" y="95" text-anchor="middle" class="small">南／正面</text></g>

  <!-- Roof projection and masonry footprint. 1 m ≈ 36 px. -->
  <rect x="245" y="210" width="960" height="310" rx="2" class="roofline"/>
  <rect x="265" y="230" width="920" height="270" class="wall"/>
  <rect x="276" y="241" width="438" height="248" class="room"/>
  <rect x="736" y="241" width="438" height="248" class="room"/>

  <!-- South doors and three centered smaller windows per classroom. -->
  <g>
    <rect x="292" y="486" width="38" height="18" class="door"/><rect x="680" y="486" width="38" height="18" class="door"/>
    <rect x="400" y="486" width="52" height="18" class="window"/><rect x="470" y="486" width="52" height="18" class="window"/><rect x="540" y="486" width="52" height="18" class="window"/>
    <rect x="742" y="486" width="38" height="18" class="door"/><rect x="1120" y="486" width="38" height="18" class="door"/>
    <rect x="860" y="486" width="52" height="18" class="window"/><rect x="930" y="486" width="52" height="18" class="window"/><rect x="1000" y="486" width="52" height="18" class="window"/>
  </g>

  <!-- Four smaller north windows per classroom. -->
  <g>
    <rect x="300" y="226" width="44" height="18" class="window"/><rect x="405" y="226" width="44" height="18" class="window"/><rect x="540" y="226" width="44" height="18" class="window"/><rect x="645" y="226" width="44" height="18" class="window"/>
    <rect x="760" y="226" width="44" height="18" class="window"/><rect x="865" y="226" width="44" height="18" class="window"/><rect x="1000" y="226" width="44" height="18" class="window"/><rect x="1105" y="226" width="44" height="18" class="window"/>
  </g>

  <g text-anchor="middle">
    <text x="495" y="345" class="label">旧教室 1</text><text x="495" y="373" class="small">不可进入｜内部不制作</text>
    <text x="955" y="345" class="label">旧教室 2</text><text x="955" y="373" class="small">不可进入｜内部不制作</text>
    <text x="725" y="545" class="label">南｜校园活动场地侧</text>
    <text x="725" y="570" class="small">每间正面：门—窗—窗—窗—门</text>
    <text x="725" y="190" class="small">北｜每间四扇较小窗</text>
  </g>

  <!-- Dimensions -->
  <line x1="265" y1="160" x2="265" y2="220" class="ext"/><line x1="1185" y1="160" x2="1185" y2="220" class="ext"/><line x1="265" y1="170" x2="1185" y2="170" class="dim"/>
  <text x="725" y="157" text-anchor="middle" class="small">约26 m｜C级总图占位值，待校准</text>
  <line x1="1215" y1="230" x2="1195" y2="230" class="ext"/><line x1="1215" y1="500" x2="1195" y2="500" class="ext"/><line x1="1215" y1="230" x2="1215" y2="500" class="dim"/>
  <text x="1234" y="365" text-anchor="middle" class="small" transform="rotate(90 1234 365)">约7.5 m｜C级占位值</text>
  <line x1="725" y1="241" x2="725" y2="489" stroke="#5d4638" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="725" y="415" text-anchor="middle" class="tiny" transform="rotate(-90 725 415)">中隔墙位置按两间等大暂定（C）</text>

  <!-- Legend and scope -->
  <g transform="translate(110 665)">
    <rect width="14" height="14" class="room"/><text x="22" y="12" class="small">教室体量</text>
    <rect x="125" width="14" height="14" class="door"/><text x="147" y="12" class="small">南向门</text>
    <rect x="250" width="14" height="14" class="window"/><text x="272" y="12" class="small">较小窗</text>
    <path d="M380 7H414" class="roofline"/><text x="424" y="12" class="small">屋檐投影</text>
  </g>
  <g transform="translate(110 720)"><rect width="570" height="165" class="confirmed"/><text x="18" y="30" class="label">已确认（A）</text><text x="18" y="62" class="small">• 一层、两个教室，正面朝南</text><text x="18" y="90" class="small">• 每间正面两侧各一门，中间三窗</text><text x="18" y="118" class="small">• 每间背面四窗，均小于两栋教学楼的窗</text><text x="18" y="146" class="small">• 不可进入，不制作完整室内</text></g>
  <g transform="translate(720 720)"><rect width="670" height="165" class="working"/><text x="18" y="30" class="label">工作值与未知项</text><text x="18" y="62" class="small">• 26 × 7.5 m来自校园总图相对比例，可信度C</text><text x="18" y="90" class="small">• 两间暂按等大；墙厚、门窗尺寸和间距尚未标定</text><text x="18" y="118" class="small">• 山墙是否有开口仍未知，图中暂不设置</text><text x="18" y="146" class="small">• 图纸用于关系确认，不是测绘图或施工图</text></g>
  <text x="70" y="960" class="tiny">图纸依据：014-old-classroom-structure-sketch.jpg 与亲历者说明｜门窗均绘制为可调整的结构占位。</text>
</svg>
