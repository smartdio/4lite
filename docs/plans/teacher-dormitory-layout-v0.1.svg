<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060">
  <defs>
    <pattern id="d-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e5e1d7"/></pattern>
    <marker id="d-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#50524d"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#292a27}.title{font-size:30px;font-weight:650}.subtitle{font-size:15px;fill:#696b65}.panel{font-size:20px;font-weight:650}.label{font-size:17px;font-weight:650}.small{font-size:13px}.tiny{font-size:11px}.wall{fill:#85644f;stroke:#513d31;stroke-width:2}.room{fill:#eadb9a}.corridor{fill:#c8dde0;stroke:#54737a;stroke-width:2}.door{fill:#77503a;stroke:#3f2b20;stroke-width:2}.window{fill:#91a4aa;stroke:#3e555b;stroke-width:2}.stair{fill:#d5ccb8;stroke:#5b5c56;stroke-width:2}.candidate{stroke-dasharray:7 5}.roofline{fill:none;stroke:#292a27;stroke-width:2;stroke-dasharray:7 5}.dim{stroke:#50524d;stroke-width:1.4;marker-start:url(#d-arrow);marker-end:url(#d-arrow)}.ext{stroke:#8c8e88;stroke-width:1;stroke-dasharray:4 4}.confirmed{fill:#e7f0e8;stroke:#72957a;stroke-width:1.5}.working{fill:#f4eee0;stroke:#aa8754;stroke-width:1.5;stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1500" height="1060" fill="#faf9f5"/><rect x="45" y="110" width="1410" height="670" fill="url(#d-grid)" opacity=".55"/>
  <text x="70" y="58" class="title">教师宿舍｜一、二层外部关系平面图 v0.1</text>
  <text x="70" y="87" class="subtitle">南北向三开间｜西向门窗｜一层无走廊｜二层西侧外挑走廊｜南墙露天楼梯</text>

  <!-- First floor -->
  <g transform="translate(120 155)">
    <text x="0" y="0" class="panel">A｜一层外部关系</text>
    <rect x="145" y="45" width="250" height="576" class="roofline"/>
    <rect x="160" y="55" width="220" height="556" class="wall"/>
    <rect x="171" y="66" width="198" height="171" class="room"/><rect x="171" y="248" width="198" height="171" class="room"/><rect x="171" y="430" width="198" height="170" class="room"/>
    <g text-anchor="middle"><text x="270" y="145" class="label">房间1</text><text x="270" y="327" class="label">房间2</text><text x="270" y="509" class="label">房间3</text></g>
    <!-- west-facing openings, direct to platform -->
    <g><rect x="154" y="90" width="18" height="38" class="window"/><rect x="154" y="170" width="18" height="42" class="door"/><rect x="154" y="272" width="18" height="38" class="window"/><rect x="154" y="352" width="18" height="42" class="door"/><rect x="154" y="454" width="18" height="38" class="window"/><rect x="154" y="534" width="18" height="42" class="door"/></g>
    <text x="128" y="335" text-anchor="middle" class="label" transform="rotate(-90 128 335)">西｜门窗直接临高台地面｜无走廊</text>
    <text x="270" y="643" text-anchor="middle" class="small">南</text><text x="270" y="37" text-anchor="middle" class="small">北</text>
    <line x1="430" y1="55" x2="430" y2="611" class="dim"/><text x="447" y="333" text-anchor="middle" class="tiny" transform="rotate(90 447 333)">外长约12.8 m｜三间×约4 m</text>
    <line x1="160" y1="670" x2="380" y2="670" class="dim"/><text x="270" y="692" text-anchor="middle" class="tiny">进深暂取约5.5 m（C）</text>
  </g>

  <!-- Second floor -->
  <g transform="translate(700 155)">
    <text x="0" y="0" class="panel">B｜二层外部关系</text>
    <rect x="145" y="45" width="250" height="576" class="roofline"/>
    <rect x="160" y="55" width="220" height="556" class="wall"/>
    <rect x="171" y="66" width="198" height="171" class="room"/><rect x="171" y="248" width="198" height="171" class="room"/><rect x="171" y="430" width="198" height="170" class="room"/>
    <rect x="105" y="55" width="55" height="556" class="corridor"/>
    <g text-anchor="middle"><text x="270" y="145" class="label">房间1</text><text x="270" y="327" class="label">房间2</text><text x="270" y="509" class="label">房间3</text></g>
    <g><rect x="154" y="90" width="18" height="38" class="window"/><rect x="154" y="170" width="18" height="42" class="door"/><rect x="154" y="272" width="18" height="38" class="window"/><rect x="154" y="352" width="18" height="42" class="door"/><rect x="154" y="454" width="18" height="38" class="window"/><rect x="154" y="534" width="18" height="42" class="door"/></g>
    <text x="132" y="333" text-anchor="middle" class="small" transform="rotate(-90 132 333)">西侧外挑走廊｜暂宽1.2 m（C）</text>
    <!-- Candidate exterior stair on south wall, rising westward to corridor. -->
    <rect x="105" y="611" width="275" height="60" class="stair candidate"/>
    <g stroke="#73746e" stroke-width="1.3"><path d="M125 611V671M150 611V671M175 611V671M200 611V671M225 611V671M250 611V671M275 611V671M300 611V671M325 611V671M350 611V671"/></g>
    <path d="M355 641H130" stroke="#50524d" stroke-width="2" marker-end="url(#d-arrow)"/><text x="242" y="696" text-anchor="middle" class="tiny">南墙露天楼梯｜上行方向为候选，可镜像（C）</text>
    <text x="270" y="37" text-anchor="middle" class="small">北</text>
    <line x1="75" y1="55" x2="75" y2="611" class="dim"/><text x="58" y="333" text-anchor="middle" class="tiny" transform="rotate(-90 58 333)">外长约12.8 m</text>
  </g>

  <g transform="translate(110 875)"><rect width="590" height="120" class="confirmed"/><text x="18" y="28" class="label">已确认</text><text x="18" y="58" class="small">• 两层；一层三间；主要门窗朝西</text><text x="18" y="84" class="small">• 一层无走廊；二层西侧为外挑走廊</text><text x="18" y="108" class="small">• 露天楼梯位于南墙；建筑不可进入</text></g>
  <g transform="translate(755 875)"><rect width="620" height="120" class="working"/><text x="18" y="28" class="label">工作值</text><text x="18" y="58" class="small">• 外长12–13 m，第一版12.8 m；进深暂取5.5 m</text><text x="18" y="84" class="small">• 二层走廊暂宽1.2 m；南墙楼梯上行方向待确认</text><text x="18" y="108" class="small">• 内部分隔仅表示三开间，不制作可进入室内</text></g>
  <text x="70" y="1035" class="tiny">本图用于外部体量和交通构件讨论，不是测绘图或施工图。</text>
</svg>
