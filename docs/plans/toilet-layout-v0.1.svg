<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <pattern id="t-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e5e1d7" stroke-width="1"/></pattern>
    <marker id="t-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#50524d"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#292a27}.title{font-size:30px;font-weight:650}.subtitle{font-size:15px;fill:#696b65}.label{font-size:18px;font-weight:650}.darklabel{font-size:18px;font-weight:650;fill:#f2eee3}.small{font-size:14px}.tiny{font-size:12px}.wall{fill:#8b6a53;stroke:#574236;stroke-width:2}.closed{fill:#363936}.entry{fill:#c7bda8}.roofline{fill:none;stroke:#252622;stroke-width:2;stroke-dasharray:7 5}.dim{stroke:#50524d;stroke-width:1.5;marker-start:url(#t-arrow);marker-end:url(#t-arrow)}.ext{stroke:#898b85;stroke-width:1;stroke-dasharray:4 4}.confirmed{fill:#e7f0e8;stroke:#72957a;stroke-width:1.5}.working{fill:#f4eee0;stroke:#aa8754;stroke-width:1.5;stroke-dasharray:7 5}.north{stroke:#33342f;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect width="1400" height="980" fill="#faf9f5"/>
  <rect x="45" y="115" width="1310" height="550" fill="url(#t-grid)" opacity=".55"/>
  <text x="70" y="58" class="title">校园厕所｜外轮廓平面图 v0.1</text>
  <text x="70" y="87" class="subtitle">约6 × 4 m｜共用入口朝南｜不可进入｜4 m总深已包含入口两侧围墙</text>

  <g transform="translate(1245 155)"><path d="M0 70V0M0 0L-10 18M0 0L10 18" class="north"/><text x="0" y="-10" text-anchor="middle" class="label">北</text><text x="0" y="95" text-anchor="middle" class="small">南／入口</text></g>

  <!-- 1 m ≈ 100 px. Total envelope 6 x 4 m. -->
  <rect x="395" y="190" width="610" height="410" class="roofline"/>
  <!-- Rear/main wall body; exact internal geometry intentionally omitted. -->
  <rect x="405" y="205" width="590" height="310" class="wall"/>
  <rect x="420" y="220" width="560" height="280" class="closed"/>
  <!-- South facade with doors at the far left and right ends. -->
  <rect x="405" y="500" width="55" height="25" class="wall"/><rect x="510" y="500" width="380" height="25" class="wall"/><rect x="940" y="500" width="55" height="25" class="wall"/>
  <rect x="460" y="496" width="50" height="33" fill="#765039" stroke="#402b1f" stroke-width="2"/>
  <rect x="890" y="496" width="50" height="33" fill="#765039" stroke="#402b1f" stroke-width="2"/>
  <!-- Two long screen walls parallel to the facade, leaving one central entrance gap. -->
  <rect x="405" y="565" width="245" height="25" class="wall"/>
  <rect x="750" y="565" width="245" height="25" class="wall"/>
  <rect x="405" y="525" width="590" height="40" class="entry"/>
  <path d="M700 610V545" stroke="#52544f" stroke-width="3" marker-end="url(#t-arrow)"/>
  <path d="M685 545H485" stroke="#52544f" stroke-width="2" marker-end="url(#t-arrow)"/><path d="M715 545H915" stroke="#52544f" stroke-width="2" marker-end="url(#t-arrow)"/>
  <path d="M485 545V516" stroke="#52544f" stroke-width="2" marker-end="url(#t-arrow)"/><path d="M915 545V516" stroke="#52544f" stroke-width="2" marker-end="url(#t-arrow)"/>

  <text x="515" y="375" text-anchor="middle" class="darklabel">女厕侧</text>
  <text x="885" y="375" text-anchor="middle" class="darklabel">男厕侧</text>
  <text x="700" y="625" text-anchor="middle" class="label">南向共用入口</text>
  <text x="700" y="648" text-anchor="middle" class="tiny">中间进入｜沿夹道走到左右两端｜再向北转入两端门洞</text>
  <text x="700" y="170" text-anchor="middle" class="small">北</text>

  <!-- dimensions -->
  <line x1="405" y1="145" x2="405" y2="190" class="ext"/><line x1="995" y1="145" x2="995" y2="190" class="ext"/><line x1="405" y1="155" x2="995" y2="155" class="dim"/><text x="700" y="142" text-anchor="middle" class="small">横向总长约6.0 m（A-）</text>
  <line x1="1045" y1="205" x2="1010" y2="205" class="ext"/><line x1="1045" y1="590" x2="810" y2="590" class="ext"/><line x1="1045" y1="205" x2="1045" y2="590" class="dim"/><text x="1064" y="398" text-anchor="middle" class="small" transform="rotate(90 1064 398)">总深约4.0 m（A-）｜包含入口墙</text>

  <g transform="translate(95 710)"><rect width="555" height="160" class="confirmed"/><text x="18" y="30" class="label">已确认（A／A-）</text><text x="18" y="61" class="small">• 一层、无窗、共用入口朝南</text><text x="18" y="89" class="small">• 入口进入后左为女厕、右为男厕</text><text x="18" y="117" class="small">• 外包约6 × 4 m，4 m包括入口两侧围墙</text><text x="18" y="145" class="small">• 不可进入，不制作内部</text></g>
  <g transform="translate(695 710)"><rect width="610" height="160" class="working"/><text x="18" y="30" class="label">图纸工作关系（C）</text><text x="18" y="61" class="small">• 两片长屏风墙的长度、墙厚及夹道宽度尚未实测</text><text x="18" y="89" class="small">• 男女门位于主体正墙最左／最右端，均被屏风墙遮挡</text><text x="18" y="117" class="small">• 屋檐投影为结构占位，不扩大6 × 4 m墙体基准</text><text x="18" y="145" class="small">• 图纸只表达入口流线，不制作厕所内部</text></g>
  <text x="70" y="940" class="tiny">依据：015-toilet-structure-sketch.jpg 与亲历者说明｜内部黑色区域只表示“不可进入／不制作”。</text>
</svg>
