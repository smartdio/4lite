name: Public code snapshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run verify:public
      - run: npm run build

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.VERCEL_PUBLIC_URL }}
    env:
      PLATFORM_ORG: ${{ vars.PRODUCTION_PLATFORM_ORG }}
      PLATFORM_PROJECT: ${{ vars.PRODUCTION_PLATFORM_PROJECT }}
      PLATFORM_ACCESS: ${{ secrets.VERCEL_TOKEN }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      RUNTIME_ASSETS_URL: ${{ vars.RUNTIME_ASSETS_URL }}
      RUNTIME_ASSETS_SHA256: ${{ vars.RUNTIME_ASSETS_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore cached runtime assets
        id: runtime-assets-cache
        uses: actions/cache/restore@v4
        with:
          path: public/assets
          key: runtime-assets-${{ vars.RUNTIME_ASSETS_SHA256 }}
      - name: Download private runtime assets
        if: steps.runtime-assets-cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/runtime-assets.tar.gz"
          test -n "$RUNTIME_ASSETS_URL"
          test -n "$RUNTIME_ASSETS_SHA256"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --output "$archive" "$RUNTIME_ASSETS_URL"
          printf '%s  %s\n' "$RUNTIME_ASSETS_SHA256" "$archive" | sha256sum --check -
          mkdir -p public/assets
          tar -xzf "$archive" -C public/assets
      - name: Save runtime assets cache
        if: steps.runtime-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/assets
          key: runtime-assets-${{ vars.RUNTIME_ASSETS_SHA256 }}
      - name: Configure production SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Link Vercel production project
        run: |
          mkdir -p .vercel
          node -e "require('node:fs').writeFileSync('.vercel/project.json', JSON.stringify({orgId: process.env.PLATFORM_ORG, projectId: process.env.PLATFORM_PROJECT}))"
          npx --yes vercel@59.10.0 pull --yes --environment=production --token "$PLATFORM_ACCESS"
      - name: Build the shared production artifact
        run: npx --yes vercel@59.10.0 build --prod --token "$PLATFORM_ACCESS"
      - run: npm run perf:build
      - name: Deploy to Vercel
        run: npx --yes vercel@59.10.0 deploy --prebuilt --prod --yes --token "$PLATFORM_ACCESS"
      - name: Deploy to the self-hosted server
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$DEPLOY_PATH'"
          archive_name="${RUNTIME_ASSETS_URL##*/}"
          rsync -az --delete --exclude "/$archive_name" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Verify both production targets
        env:
          VERCEL_PUBLIC_URL: ${{ vars.VERCEL_PUBLIC_URL }}
          SERVER_PUBLIC_URL: ${{ vars.SERVER_PUBLIC_URL }}
        run: |
          main_asset="$(find dist/assets -maxdepth 1 -type f -name 'main-*.js' -printf '%f\n')"
          test -n "$main_asset"
          expected_sha="$(sha256sum "dist/assets/$main_asset" | awk '{print $1}')"

          for base_url in "$VERCEL_PUBLIC_URL" "$SERVER_PUBLIC_URL"; do
            for route in / /en/ /about/ /help/ /en/about/ /en/help/; do
              curl --fail --silent --show-error --output /dev/null "$base_url$route"
            done

            deployed_sha="$(curl --fail --silent --show-error "$base_url/assets/$main_asset" | sha256sum | awk '{print $1}')"
            test "$deployed_sha" = "$expected_sha"
          done
